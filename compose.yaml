# Ambiente local em um comando: `docker compose up --build`.
# db -> setup (migrations + seed de demonstração) -> api, nessa ordem.
x-database-url: &database-url postgresql://${POSTGRES_USER:-banco_inter}:${POSTGRES_PASSWORD:-banco_inter_local}@db:5432/${POSTGRES_DB:-banco_inter}

services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-banco_inter}
      POSTGRES_USER: ${POSTGRES_USER:-banco_inter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-banco_inter_local}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Executa a cada `up` e termina: aplica as migrations pendentes de
  # migrations/ (copiadas na imagem; use --build depois de um pull) e grava o
  # seed. SEED_DEMO=if-empty (padrão) preserva dados; reset recria a massa.
  setup:
    build: .
    command: ["node", "dist/scripts/setup-db.js"]
    environment:
      DATABASE_URL: *database-url
      SEED_DEMO: ${SEED_DEMO:-if-empty}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    environment:
      DATABASE_URL: *database-url
      # Ambiente local: development expõe /api/mock/* e as intenções POST.
      NODE_ENV: ${API_NODE_ENV:-development}
      HOST: 0.0.0.0
      PORT: "3000"
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"
    depends_on:
      setup:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
